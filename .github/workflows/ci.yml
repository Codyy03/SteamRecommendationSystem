name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # Backend (.NET)
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./steam-discovery-platform/steam-discovery-platform.Server

    - name: Build
      run: dotnet build ./steam-discovery-platform/steam-discovery-platform.Server --no-restore

    - name: Test
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=fake;Username=postgres;Password=postgres"
      run: dotnet test ./steam-discovery-platform/steam-discovery-platform.Server.Tests --verbosity normal

    # Frontend (React)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install --prefix ./steam-discovery-platform/steam-discovery-platform.client

    - name: Build React app
      run: npm run build --prefix ./steam-discovery-platform/steam-discovery-platform.client